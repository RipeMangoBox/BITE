<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="sample-level success / failure delta 对比">
<!-- diagnostic observation: sample-level internal trace tensors only; no final evaluator -->
<style>
text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','DejaVu Sans',sans-serif;fill:#26312f}
.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#53615d}.small{font-size:12px;fill:#53615d}.label{font-size:13px}
.axis{stroke:#60706b;stroke-width:1}.grid{stroke:#d8dfdb;stroke-width:1}.card{fill:#fffdf8;stroke:#d8dfdb;stroke-width:1}
</style>
<rect x="0" y="0" width="1100" height="600" fill="#fbfaf5"/>
<text class="title" x="95" y="48">sample-level success / failure delta 对比</text>
<text class="subtitle" x="95" y="74">每个 baseline 各 1 个 success control 与 1 个 failure probe；metric=relative_l2。</text>
