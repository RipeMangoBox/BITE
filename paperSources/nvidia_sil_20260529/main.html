<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Publications from the NVIDIA Spatial Intelligence Lab (SIL): peer-reviewed papers, tech reports, and open-source releases on spatial AI, simulation, and 3D perception.">
    <meta name="theme-color" content="#76b900">
    <title>Publications - NVIDIA SIL</title>
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/labs/sil/shared/main-layout.css">
    <link rel="stylesheet" href="/labs/sil/shared/content-pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" integrity="sha256-FMvZuGapsJLjouA6k7Eo2lusoAX9i0ShlWFG6qt7SLc=" crossorigin="anonymous">
    
    <style>
        /* Page-specific styles for Publications page */
        .container > h1 { margin-top: 0; }
        .container {
            max-width: 1000px;
        }

        .pagination-btn {
            min-width: 40px;
            text-align: center;
            white-space: nowrap;
        }

        .pagination-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .pagination-dots {
            padding: 8px 4px;
            color: var(--text-light);
            font-weight: bold;
        }

        .pagination-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .display-all-btn {
            background: var(--primary-color);
            color: white;
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 10px;
            white-space: nowrap;
        }

        .display-all-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(118, 185, 0, 0.3);
        }

        .display-all-btn.active {
            background: white;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .display-all-btn.active:hover {
            background: rgba(118, 185, 0, 0.05);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(118, 185, 0, 0.2);
        }

        .result-summary {
            text-align: center;
            margin: 20px 0;
            color: var(--text-medium);
            font-size: 14px;
        }

        .publication {
            background: var(--bg-light);
            border-radius: var(--border-radius);
            padding: 6px 20px 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px var(--shadow-light);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .publication:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow-medium);
        }

        .pub-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .pub-authors {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 6px; /* authors → venue spacing */
            text-align: center;
        }

        .pub-venue {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 0;
            text-align: center;
        }

        .pub-venue-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .pub-abstract-toggle-row {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
        }

        .pub-links {
            display: flex;
            column-gap: 20px;
            row-gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .pub-link {
            display: inline-block;
            padding: 6px 12px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .pub-link:hover {
            background: var(--primary-hover);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(118, 185, 0, 0.3);
            text-decoration: none;
        }

        /* Ensure all buttons have consistent styling */
        .pagination-btn:hover:not(:disabled) {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(118, 185, 0, 0.2);
        }

        .abstract-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: white;
            color: var(--text-medium);
            border: 2px solid #e1e5e9;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .abstract-toggle .toggle-text {
            display: inline-block;
            min-width: 13ch;
        }

        .abstract-toggle:hover {
            background: white;
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(118, 185, 0, 0.2);
        }

        .abstract-toggle.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(118, 185, 0, 0.3);
        }

        .abstract-toggle.active:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .toggle-icon {
            font-size: 10px;
            transition: transform 0.2s ease;
        }

        .abstract-toggle.active .toggle-icon {
            transform: rotate(180deg);
        }

        .pub-abstract {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 0;
        }

        .pub-abstract.visible {
            max-height: 500px;
            margin-top: 6px;
            margin-bottom: 6px; /* abstract → links spacing */
        }

        .pub-abstract-content {
            padding: 12px;
            background: rgba(0, 0, 0, 0.02);
            border-left: 3px solid var(--primary-color);
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-medium);
        }

        .pub-image {
            width: 100px;
            height: 60px;
            object-fit: cover;
            border-radius: var(--border-radius);
            float: right;
            margin-left: 15px;
        }

        /* Responsive Design */
        /* Search Styles */
        .search-container {
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: 800px;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 600px; /* match input width so clear aligns to input edge */
            margin: 0 auto; /* center the whole control */
        }

        .search-input {
            width: 100%;
            max-width: 600px;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: white;
            /* Reserve space for the clear button so layout never shifts */
            padding-right: 72px;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(118, 185, 0, 0.1);
        }

        .search-input::placeholder {
            color: #9ca3af;
        }

        .search-results-info {
            font-size: 14px;
            line-height: 14px; /* tighter line spacing to reduce vertical whitespace */
            min-height: 14px;  /* reserve space so layout doesn't shift when empty */
            color: var(--text-medium);
            margin-top: 0px;   /* slightly less space above */
            margin-bottom: 0px;   /* slightly less space above */
        }

        .clear-search {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
            padding: 0;
            /* Absolutely position over the right side of the input */
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            /* Keep element in layout without shifting input */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1;
        }

        .clear-search:hover {
            color: var(--primary-hover);
        }

        .clear-search.visible {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            .pub-image {
                width: 80px;
                height: 50px;
            }

            .pub-venue-container {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .pub-venue {
                min-width: 0;
                flex: 0 1 auto;
            }

            .abstract-toggle {
                font-size: 11px;
                padding: 5px 10px;
            }

            .pagination-controls {
                gap: 10px;
            }

            .pagination-nav {
                gap: 4px;
            }

            .pagination-btn {
                padding: 6px 8px;
                font-size: 12px;
                min-width: 32px;
            }

            .search-container {
                margin: 15px auto;
                max-width: 95%;
            }

            .search-input-wrapper {
                max-width: 100%;
            }

            .search-input {
                max-width: 100%;
                font-size: 16px; /* Prevent zoom on iOS */
            }

            .display-all-btn {
                padding: 6px 12px;
                font-size: 12px;
                margin-left: 6px;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Publications</h1>
        <!-- <div class="header2-content">
            Research from the <a href="https://research.nvidia.com/labs/prl/" target="_parent">High-Fidelity Physics Research Group</a> are <a href="https://research.nvidia.com/labs/prl/#publications" target="_parent">here</a> and the <a href="https://research.nvidia.com/labs/dvl/" target="_parent">Dynamic Vision and Learning Group</a> are <a href="https://research.nvidia.com/labs/dvl/#publications" target="_parent">here</a>.
        </div> -->
        
        <!-- Search Container -->
        <div class="search-container">
            <div class="search-input-wrapper">
                <label for="searchInput" class="sr-only">Search publications</label>
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    aria-label="Search publications"
                    placeholder="Search publications by title, authors, venue, or tags..."
                    autocomplete="off"
                >
                <button id="clearSearch" class="clear-search" aria-label="Clear search" hidden>Clear</button>
            </div>
            <div id="searchInfo" class="search-results-info" role="status" aria-live="polite" aria-atomic="true"></div>
        </div>

        <h2 class="sr-only">Publications list</h2>
        <div class="loading" id="loading" role="status" aria-live="polite">Loading publications...</div>
        <div id="publications-container" style="min-height: 800px;" aria-busy="true"></div>
        
        <!-- Pagination Navigation -->
        <div class="pagination-controls" id="paginationControls" style="display: none;">
            <div class="pagination-nav" id="paginationNav"></div>
        </div>


    </div>

    <script src="/labs/sil/publications/publications.js" async></script>
    <script>
        // Simple pagination state
        let currentPage = 1;
        const itemsPerPage = 20;
        let publicationsData = [];
        let filteredPublications = [];
        let currentSearchTerm = '';
        let showAllMode = false;

        // Simple scroll to top function
        function scrollToTop() {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (error) {
                // Silent fail
            }
        }

        // Toggle abstract visibility
        function toggleAbstract(pubId, toggleButton) {
            const abstractElement = document.getElementById(pubId);
            if (!toggleButton) {
                toggleButton = document.querySelector(`button[aria-controls="${pubId}"]`);
            }
            if (!abstractElement || !toggleButton) return;
            const toggleText = toggleButton.querySelector('.toggle-text');
            const isExpanded = abstractElement.classList.toggle('visible');
            toggleButton.classList.toggle('active', isExpanded);
            toggleButton.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
            if (toggleText) toggleText.textContent = isExpanded ? 'Hide abstract' : 'Show abstract';

            // Trigger smart iframe resize after abstract toggle animation
            // Wait for the CSS transition to complete (300ms as defined in CSS)
            setTimeout(() => {
                triggerSmartIframeResize();
            }, 350);
        }

        // Search functionality
        function searchPublications(searchTerm) {
            
            currentSearchTerm = searchTerm.toLowerCase().trim();
            
            if (!currentSearchTerm) {
                filteredPublications = [...publicationsData];
            } else {
                filteredPublications = publicationsData.filter(pub => {
                    // Search in title
                    if (pub.title && pub.title.toLowerCase().includes(currentSearchTerm)) {
                        return true;
                    }
                    
                    // Search in authors
                    if (pub.authors) {
                        let authorsStr = '';
                        if (Array.isArray(pub.authors)) {
                            authorsStr = pub.authors.join(' ').toLowerCase();
                        } else if (typeof pub.authors === 'string') {
                            authorsStr = pub.authors.toLowerCase();
                        }
                        if (authorsStr.includes(currentSearchTerm)) {
                            return true;
                        }
                    }
                    
                    // Search in publication venue
                    if (pub.publication && pub.publication.toLowerCase().includes(currentSearchTerm)) {
                        return true;
                    }
                    
                    // Search in tags
                    if (pub.tags) {
                        if (Array.isArray(pub.tags)) {
                            if (pub.tags.some(tag => tag.toLowerCase().includes(currentSearchTerm))) {
                                return true;
                            }
                        } else if (typeof pub.tags === 'string') {
                            // Handle string format like "[Computer Vision, Machine Learning]"
                            if (pub.tags.toLowerCase().includes(currentSearchTerm)) {
                                return true;
                            }
                        }
                    }
                    
                    // Search in abstract
                    if (pub.abstract && pub.abstract.toLowerCase().includes(currentSearchTerm)) {
                        return true;
                    }
                    
                    return false;
                });
            }
            
            // Reset to first page when searching
            currentPage = 1;
            renderPublications();
            updateSearchInfo();
        }

        function updateSearchInfo() {
            const searchInfo = document.getElementById('searchInfo');
            const clearButton = document.getElementById('clearSearch');
            
            if (currentSearchTerm) {
                const resultCount = filteredPublications.length;
                const totalCount = publicationsData.length;
                searchInfo.textContent = `Showing ${resultCount} of ${totalCount} publications`;
                clearButton.classList.add('visible');
                clearButton.hidden = false;
            } else {
                searchInfo.textContent = '';
                clearButton.classList.remove('visible');
                clearButton.hidden = true;
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchPublications('');
        }

        // Initialize search event listeners
        function initializeSearch() {
            const searchInput = document.getElementById('searchInput');
            const clearButton = document.getElementById('clearSearch');
            
            let searchDebounceTimer = null;
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = setTimeout(() => {
                        searchPublications(e.target.value);
                    }, 200);
                });
            }
            
            if (clearButton) {
                clearButton.addEventListener('click', clearSearch);
            }
        }

        // Function to go to specific page
        function goToPage(page) {
            
            currentPage = page;
            renderPublications();
            scrollToTop();
        }

        // Function to toggle display all mode
        function toggleDisplayAll() {
            showAllMode = !showAllMode;
            if (showAllMode) {
                // When switching to show all, reset to first page
                currentPage = 1;
            }
            renderPublications();
            scrollToTop();
        }

        // Function to generate pagination navigation
        function generatePagination(totalPages) {
            const nav = document.getElementById('paginationNav');
            if (!nav) {
                return;
            }

            // Always show pagination controls if there are publications
            const totalPublications = filteredPublications.length > 0 || currentSearchTerm ? filteredPublications.length : publicationsData.length;
            if (totalPublications === 0) {
                document.getElementById('paginationControls').style.display = 'none';
                return;
            }

            document.getElementById('paginationControls').style.display = 'flex';
            nav.innerHTML = '';

            if (showAllMode) {
                // Show all mode - show summary text first, then toggle button
                const summary = document.createElement('span');
                summary.className = 'pagination-dots';
                summary.textContent = `Showing all ${totalPublications} publications`;
                nav.appendChild(summary);

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'display-all-btn';
                toggleBtn.textContent = 'Back to Pages';
                toggleBtn.onclick = toggleDisplayAll;
                nav.appendChild(toggleBtn);
                
            } else if (totalPages <= 1) {
                // Only one page - just show display all option
                const displayAllBtn = document.createElement('button');
                displayAllBtn.className = 'display-all-btn';
                displayAllBtn.textContent = 'Display All';
                displayAllBtn.onclick = toggleDisplayAll;
                nav.appendChild(displayAllBtn);
                
            } else {
                // Normal pagination mode with multiple pages
                
                // Previous button
                const prevBtn = document.createElement('button');
                prevBtn.className = 'pagination-btn';
                prevBtn.textContent = '‹ Prev';
                prevBtn.disabled = currentPage === 1;
                prevBtn.onclick = () => goToPage(currentPage - 1);
                nav.appendChild(prevBtn);

                // Page numbers
                const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
                const maxVisiblePages = viewportWidth <= 480 ? 3 : 5;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
                let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

                // Adjust start if we're near the end
                if (endPage - startPage < maxVisiblePages - 1) {
                    startPage = Math.max(1, endPage - maxVisiblePages + 1);
                }

                // First page + dots if needed
                if (startPage > 1) {
                    const firstBtn = document.createElement('button');
                    firstBtn.className = 'pagination-btn';
                    firstBtn.textContent = '1';
                    firstBtn.onclick = () => goToPage(1);
                    nav.appendChild(firstBtn);

                    if (startPage > 2) {
                        const dots = document.createElement('span');
                        dots.className = 'pagination-dots';
                        dots.textContent = '...';
                        nav.appendChild(dots);
                    }
                }

                // Page number buttons
                for (let i = startPage; i <= endPage; i++) {
                    const pageBtn = document.createElement('button');
                    pageBtn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
                    pageBtn.textContent = i;
                    pageBtn.onclick = () => goToPage(i);
                    nav.appendChild(pageBtn);
                }

                // Last page + dots if needed
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        const dots = document.createElement('span');
                        dots.className = 'pagination-dots';
                        dots.textContent = '...';
                        nav.appendChild(dots);
                    }

                    const lastBtn = document.createElement('button');
                    lastBtn.className = 'pagination-btn';
                    lastBtn.textContent = totalPages;
                    lastBtn.onclick = () => goToPage(totalPages);
                    nav.appendChild(lastBtn);
                }

                // Next button
                const nextBtn = document.createElement('button');
                nextBtn.className = 'pagination-btn';
                nextBtn.textContent = 'Next ›';
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.onclick = () => goToPage(currentPage + 1);
                nav.appendChild(nextBtn);

                // Add display all button at the end
                const displayAllBtn = document.createElement('button');
                displayAllBtn.className = 'display-all-btn';
                displayAllBtn.textContent = 'Display All';
                displayAllBtn.onclick = toggleDisplayAll;
                nav.appendChild(displayAllBtn);
            }
        }

        // Function to calculate actual content height (scrollHeight doesn't shrink!)
        function calculateActualContentHeight() {
            // Get the actual bottom position of the last element
            const body = document.body;
            const html = document.documentElement;
            
            // Get all major elements
            const header = document.querySelector('h1');
            const headerContent = document.querySelector('.header2-content');
            const searchContainer = document.querySelector('.search-container');
            const publicationsContainer = document.getElementById('publications-container');
            const paginationControls = document.getElementById('paginationControls');
            
            let maxBottom = 0;
            
            // Find the bottom-most element
            [header, headerContent, searchContainer, publicationsContainer, paginationControls].forEach(element => {
                if (element && element.offsetParent !== null) {
                    const rect = element.getBoundingClientRect();
                    const elementBottom = rect.bottom + window.scrollY;
                    maxBottom = Math.max(maxBottom, elementBottom);
                }
            });
            
            // Add some padding
            const finalHeight = maxBottom + 100;
            
            return finalHeight;
        }

        // Function to trigger smart iframe resize with proper height calculation
        function triggerSmartIframeResize() {
            // Reset to fast checking mode ONCE
            try {
                if (window.parent && window.parent !== window && window.parent.resetToFastChecking) {
                    window.parent.resetToFastChecking();
                }
            } catch (e) {
                // Silent fail
            }
            
            // Calculate the actual content height manually
            const actualHeight = calculateActualContentHeight();
            
            // Force set the iframe height to the calculated height
            try {
                if (window.parent && window.parent !== window) {
                    const iframe = window.parent.document.getElementById('contentFrame');
                    if (iframe) {
                        iframe.style.height = actualHeight + 'px';
                        iframe.style.minHeight = actualHeight + 'px';

                    }
                }
                         } catch (e) {
                 // Silent fail
             }
            
            // Also dispatch event with calculated height
            try {
                if (window.parent && window.parent !== window) {
                    const event = new CustomEvent('contentHeightChanged', {
                        detail: { height: actualHeight }
                    });
                    window.parent.dispatchEvent(event);
                }
            } catch (e) {
                // Silent fail
            }
        }

        // Helpers for chronological sorting and grouping
        function normalizeVenueName(venue) {
            if (!venue || typeof venue !== 'string') return '';
            const v = venue.toLowerCase();
            if (v.includes('siggraph asia')) return 'siggraph asia';
            if (v.includes('siggraph')) return 'siggraph';
            if (v.includes('cvpr')) return 'cvpr';
            if (v.includes('iccv')) return 'iccv';
            if (v.includes('eccv')) return 'eccv';
            if (v.includes('neurips') || v.includes('nips')) return 'neurips';
            if (v.includes('icml')) return 'icml';
            if (v.includes('iclr')) return 'iclr';
            if (v.includes('emnlp')) return 'emnlp';
            if (v.includes('sgp')) return 'sgp';
            if (v.includes('tpami')) return 'tpami';
            if (v.includes('ijcv')) return 'ijcv';
            if (v.includes('pami')) return 'tpami';
            return venue.trim().toLowerCase();
        }

        // Approximate typical event months (0-based JS months)
        const VENUE_TO_MONTH = {
            'cvpr': 5,            // June
            'iccv': 9,            // October
            'eccv': 9,            // October
            'neurips': 11,        // December
            'icml': 6,            // July
            'iclr': 4,            // May
            'siggraph': 7,        // August
            'siggraph asia': 11,  // December
            'sgp': 6,             // July
            'emnlp': 10,          // November
            'tpami': 6,           // Mid-year (approx)
            'ijcv': 6             // Mid-year (approx)
        };

        function extractYearFromText(text) {
            if (!text) return null;
            const match = String(text).match(/(20\d{2}|19\d{2})/);
            return match ? parseInt(match[1], 10) : null;
        }

        function extractArxivYearMonthFromUrl(url) {
            if (!url || typeof url !== 'string') return { year: null, month: null };
            // Matches .../abs/YYMM.xxxxx or .../pdf/YYMM.xxxxx
            const m = url.match(/arxiv\.org\/(abs|pdf)\/(\d{2})(\d{2})\./i);
            if (m) {
                const yy = parseInt(m[2], 10);
                const mm = parseInt(m[3], 10);
                const year = yy >= 90 ? 1900 + yy : 2000 + yy; // arXiv modern IDs are 2007+, but this is safe
                const month = Math.min(Math.max(mm - 1, 0), 11);
                return { year, month };
            }
            return { year: null, month: null };
        }

        function computeSortMeta(pub) {
            // 1) Explicit date field if present
            if (pub.date) {
                const d = new Date(pub.date);
                if (!isNaN(d.getTime())) {
                    return { year: d.getFullYear(), month: d.getMonth(), venueKey: normalizeVenueName(pub.publication || '') };
                }
            }

            // 2) From publication string (e.g., "ICCV 2025")
            const venueKey = normalizeVenueName(pub.publication || '');
            const yearFromPub = extractYearFromText(pub.publication);
            if (yearFromPub) {
                const monthGuess = VENUE_TO_MONTH[venueKey] !== undefined ? VENUE_TO_MONTH[venueKey] : 6; // default July
                return { year: yearFromPub, month: monthGuess, venueKey };
            }

            // 3) From arXiv URL
            const paperUrl = pub.paper || pub.url_pdf;
            const { year: axYear, month: axMonth } = extractArxivYearMonthFromUrl(paperUrl);
            if (axYear) {
                return { year: axYear, month: axMonth ?? 6, venueKey };
            }

            // 4) Fallback: unknown year -> push older
            return { year: 0, month: 0, venueKey };
        }

        function venuePriority(venueKey) {
            // Higher priority first when months equal; adjust as desired
            const order = [
                'cvpr', 'iccv', 'eccv', 'neurips', 'icml', 'iclr', 'siggraph', 'siggraph asia', 'sgp', 'emnlp', 'tpami', 'ijcv'
            ];
            const idx = order.indexOf(venueKey);
            return idx === -1 ? order.length : idx;
        }

        // Defense-in-depth HTML escape for strings injected into template literals.
        function escapeHtml(value) {
            if (value == null) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function escapeAttr(value) { return escapeHtml(value); }

        // Function to render publications
        function renderPublications() {
            const container = document.getElementById('publications-container');
            const loading = document.getElementById('loading');
            
            if (!container) {
                return;
            }
            
            // Hide loading message
            loading.style.display = 'none';
            
            let html = '';
            let publicationsToShow = [];
            
            // Use filtered publications or all publications if no search
            const dataToUse = filteredPublications.length > 0 || currentSearchTerm ? filteredPublications : publicationsData;
            
            // Sort publications: newest first, group by venue per year
            const sortedPublications = [...dataToUse].sort((a, b) => {
                const A = computeSortMeta(a);
                const B = computeSortMeta(b);
                // Year desc
                if (A.year !== B.year) return B.year - A.year;
                // Month desc
                if (A.month !== B.month) return B.month - A.month;
                // Venue grouping (priority asc so groups together consistently)
                const vp = venuePriority(A.venueKey) - venuePriority(B.venueKey);
                if (vp !== 0) return vp;
                // Stable tie-breakers to keep deterministic order
                const pubA = (a.publication || '').localeCompare(b.publication || '');
                if (pubA !== 0) return pubA;
                return (a.title || '').localeCompare(b.title || '');
            });

            // Calculate pagination
            const totalPublications = sortedPublications.length;
            const totalPages = Math.ceil(totalPublications / itemsPerPage);
            
            if (showAllMode) {
                // Show all publications
                publicationsToShow = sortedPublications;
            } else {
                // Show paginated results
                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = Math.min(startIndex + itemsPerPage, totalPublications);
                publicationsToShow = sortedPublications.slice(startIndex, endIndex);
            }
            
            publicationsToShow.forEach(pub => {
                // Handle both array and string formats for authors
                let authorsStr = '';
                if (Array.isArray(pub.authors)) {
                    authorsStr = pub.authors.join(', ');
                } else if (typeof pub.authors === 'string') {
                    // If it's a string that looks like an array, parse it
                    if (pub.authors.startsWith('[') && pub.authors.endsWith(']')) {
                        // Remove brackets and split by comma
                        authorsStr = pub.authors.slice(1, -1).split(',').map(author => author.trim()).join(', ');
                    } else {
                        authorsStr = pub.authors;
                    }
                } else {
                    authorsStr = 'Unknown authors';
                }
                
                const pubId = `pub-${Math.random().toString(36).substr(2, 9)}`;

                // Backward-compatible link fields
                const paperUrl = pub.paper || pub.url_pdf;
                const codeUrl = pub.code || pub.url_code;
                const projectUrl = pub.project || pub.url_project;
                const videoUrl = pub.video || pub.url_video;
                const modelUrl = pub.model || pub.url_model;
                const demoUrl = pub.demo || pub.url_demo;
                const datasetUrl = pub.dataset || pub.data || pub.url_dataset || pub.url_data;
                const blogUrl = pub.blog || pub.url_blog;
                const safeTitle = escapeHtml(pub.title);
                const safeTitleAttr = escapeAttr(pub.title);
                const safeAuthors = escapeHtml(authorsStr);
                const safeVenue = escapeHtml(pub.publication);
                const safeAbstract = escapeHtml(pub.abstract);
                html += `
                    <div class="publication">
                        <div class="pub-header">
                            <h3 class="pub-title">${safeTitle}</h3>
                            <div class="pub-authors">${safeAuthors}</div>
                            ${pub.publication ? `
                                <div class="pub-venue-container">
                                    <div class="pub-venue">${safeVenue}</div>
                                </div>
                            ` : ''}
                            ${pub.abstract ? `
                                <div class="pub-abstract-toggle-row">
                                    <button class="abstract-toggle" type="button" aria-expanded="false" aria-controls="${pubId}" onclick="toggleAbstract('${pubId}', this)">
                                        <span class="toggle-text">Show abstract</span>
                                        <span class="toggle-icon" aria-hidden="true">▼</span>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        ${pub.abstract ? `
                            <div class="pub-abstract" id="${pubId}">
                                <div class="pub-abstract-content">${safeAbstract}</div>
                            </div>
                        ` : ''}
                        <div class="pub-links">
                            ${paperUrl ? `<a href="${escapeAttr(paperUrl)}" target="_blank" rel="noopener noreferrer" class="pub-link" aria-label="Paper: ${safeTitleAttr}">Paper</a>` : ''}
                            ${codeUrl ? `<a href="${escapeAttr(codeUrl)}" target="_blank" rel="noopener noreferrer" class="pub-link" aria-label="Code for ${safeTitleAttr}">Code</a>` : ''}
                            ${projectUrl ? `<a href="${escapeAttr(projectUrl)}" target="_blank" rel="noopener noreferrer" class="pub-link" aria-label="Project page: ${safeTitleAttr}">Project</a>` : ''}
                            ${modelUrl ? `<a href="${escapeAttr(modelUrl)}" target="_blank" rel="noopener noreferrer" class="pub-link" aria-label="Model for ${safeTitleAttr}">Model</a>` : ''}
                            ${demoUrl ? `<a href="${escapeAttr(demoUrl)}" target="_blank" rel="noopener noreferrer" class="pub-link" aria-label="Demo for ${safeTitleAttr}">Demo</a>` : ''}
                            ${datasetUrl ? `<a href="${escapeAttr(datasetUrl)}" target="_blank" rel="noopener noreferrer" class="pub-link" aria-label="Dataset for ${safeTitleAttr}">Dataset</a>` : ''}
                            ${videoUrl ? `<a href="${escapeAttr(videoUrl)}" target="_blank" rel="noopener noreferrer" class="pub-link" aria-label="Video for ${safeTitleAttr}">Video</a>` : ''}
                            ${blogUrl ? `<a href="${escapeAttr(blogUrl)}" target="_blank" rel="noopener noreferrer" class="pub-link" aria-label="Blog post: ${safeTitleAttr}">Blog</a>` : ''}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            container.setAttribute('aria-busy', 'false');

            // Generate pagination controls
            generatePagination(totalPages);
            
            // Trigger smart iframe resize after content has been updated
            // Use requestAnimationFrame to ensure DOM has been updated
            requestAnimationFrame(() => {
                triggerSmartIframeResize();
            });
        }
        
        // Function to wait for PUBLICATIONS_DATA to be available
        function waitForPublicationsData(callback, attempts = 0) {
            const data = window.PUBLICATIONS_DATA || PUBLICATIONS_DATA;
            if (typeof data !== 'undefined' && data.length > 0) {
                publicationsData = data;
                filteredPublications = [...data]; // Initialize filtered publications
                callback();
            } else if (attempts < 10) {
                // Wait 100ms and try again
                setTimeout(() => waitForPublicationsData(callback, attempts + 1), 100);
            } else {
                // Show error message in the UI
                const container = document.getElementById('publications-container');
                if (container) {
                    container.innerHTML = '<div style="text-align: center; padding: 40px; color: #e74c3c;">Error: Could not load publications data.</div>';
                }
            }
        }
        
        // Initialize when DOM is loaded
        function initializePublications() {
            waitForPublicationsData(() => {
                initializeSearch(); // Initialize search functionality
                renderPublications();
                // Trigger smart iframe resize for initial load
                setTimeout(() => {
                    triggerSmartIframeResize();
                }, 250);
            });
        }
        
        if (document.readyState === 'loading') {
            // DOM is still loading, wait for DOMContentLoaded
            document.addEventListener('DOMContentLoaded', initializePublications);
        } else {
            // DOM is already loaded, initialize immediately
            initializePublications();
        }
    </script>

    <div class="container">
        <nav class="nav-back" role="navigation" aria-label="Return navigation">
            <a href="../" target="_parent">
                <i class="fas fa-home" aria-hidden="true"></i> 
                <span>Return to SIL Homepage</span>
            </a>
        </nav>
    </div>
