global:
  hard_filter:
    year_min: 2022
    venue_allow:
      tier1: [CVPR, ICCV, ECCV, NeurIPS, ICML, ICLR, ACL, EMNLP]
      tier2: [AAAI, IJCAI, WACV, BMVC, MM, ICRA, IROS, CoRL]
  soft_signals:
    weights:
      has_code: 3
      venue_tier1: 5
      venue_tier2: 2
      recency_bonus: 2
    threshold_brief: 4
    threshold_full_candidate: 7
  per_sync_budget:
    max_new_brief: 30
    max_new_full_candidates: 10
