<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f6f2"/>
      <stop offset="100%" stop-color="#eef4f3"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 48px "Noto Sans CJK SC", "Source Han Sans SC", "Inter", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 24px "Noto Sans CJK SC", "Source Han Sans SC", "Inter", Arial, sans-serif; fill: #475569; }
      .cardTitle { font: 700 30px "Noto Sans CJK SC", "Source Han Sans SC", "Inter", Arial, sans-serif; fill: #111827; }
      .label { font: 600 18px "Noto Sans CJK SC", "Source Han Sans SC", "Inter", Arial, sans-serif; fill: #334155; }
      .small { font: 400 17px "Noto Sans CJK SC", "Source Han Sans SC", "Inter", Arial, sans-serif; fill: #475569; }
      .mono { font: 500 17px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .pill { font: 600 16px "Noto Sans CJK SC", "Source Han Sans SC", "Inter", Arial, sans-serif; fill: #0f3f3b; }
      .bottom { font: 700 26px "Noto Sans CJK SC", "Source Han Sans SC", "Inter", Arial, sans-serif; fill: #0f766e; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="126" cy="142" r="52" fill="#0f766e" opacity="0.10"/>
  <circle cx="1270" cy="718" r="82" fill="#d97706" opacity="0.10"/>
  <circle cx="1160" cy="126" r="38" fill="#7c3aed" opacity="0.08"/>

  <text x="82" y="92" class="title">ResearchFlow v0.1.1 -> BITE v0.4</text>
  <text x="84" y="132" class="subtitle">从本地论文知识库，到 evidence-driven research memory</text>

  <rect x="78" y="186" width="520" height="530" rx="18" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="802" y="186" width="520" height="530" rx="18" fill="#ffffff" filter="url(#softShadow)"/>

  <text x="122" y="246" class="cardTitle">v0.1.1 ResearchFlow</text>
  <text x="122" y="282" class="small">早期本地知识库结构</text>

  <rect x="122" y="326" width="392" height="56" rx="8" fill="#f1f5f9"/>
  <text x="148" y="361" class="mono">paperAnalysis/</text>
  <rect x="122" y="392" width="392" height="56" rx="8" fill="#f1f5f9"/>
  <text x="148" y="427" class="mono">paperPDFs/</text>
  <rect x="122" y="458" width="392" height="56" rx="8" fill="#f1f5f9"/>
  <text x="148" y="493" class="mono">paperCollection/</text>
  <rect x="122" y="524" width="392" height="56" rx="8" fill="#f1f5f9"/>
  <text x="148" y="559" class="mono">paperIDEAs/</text>

  <line x1="122" y1="622" x2="514" y2="622" stroke="#e2e8f0" stroke-width="2"/>
  <text x="122" y="662" class="label">Markdown / CSV</text>
  <text x="320" y="662" class="label">小规模示例库</text>
  <text x="122" y="696" class="small">查询、对比、idea 初步串联</text>

  <text x="846" y="246" class="cardTitle">v0.4 BITE</text>
  <text x="846" y="282" class="small">证据链 + 资产层级 + 公开 evidence layer</text>

  <rect x="846" y="316" width="392" height="52" rx="8" fill="#ecfdf5"/>
  <text x="872" y="349" class="mono">obsidian-vault/analysis/</text>
  <rect x="846" y="378" width="392" height="52" rx="8" fill="#ecfdf5"/>
  <text x="872" y="411" class="mono">obsidian-vault/index/</text>
  <rect x="846" y="440" width="392" height="52" rx="8" fill="#ecfdf5"/>
  <text x="872" y="473" class="mono">obsidian-vault/paperPDFs/</text>
  <rect x="846" y="502" width="392" height="52" rx="8" fill="#ecfdf5"/>
  <text x="872" y="535" class="mono">obsidian-vault/ideas/</text>

  <line x1="846" y1="592" x2="1238" y2="592" stroke="#d1fae5" stroke-width="2"/>
  <text x="846" y="632" class="label">formal analysis chain</text>
  <text x="1088" y="632" class="label">L0-L5</text>
  <text x="846" y="666" class="small">ICLR26 近 1k 篇公开资产</text>
  <text x="1088" y="666" class="small">HF 增量同步</text>
  <text x="846" y="700" class="small">多 Agent 共享 research memory</text>

  <path d="M638 432 C688 405 735 405 782 432" fill="none" stroke="url(#arrow)" stroke-width="12" stroke-linecap="round"/>
  <path d="M765 404 L802 432 L765 460 Z" fill="#0f766e"/>
  <text x="644" y="384" class="pill">重构</text>
  <text x="696" y="384" class="pill">更名</text>
  <text x="748" y="384" class="pill">开放</text>

  <rect x="178" y="772" width="1044" height="70" rx="14" fill="#ffffff" opacity="0.92"/>
  <text x="256" y="816" class="bottom">先沉淀结构化证据，再让 idea 从 evidence 中涌现</text>
</svg>
